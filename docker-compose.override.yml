services:
  web:
    image: node:20-alpine
    container_name: appvestidos-web-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "100"
      NODE_ENV: development
      HOST: "0.0.0.0"
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      WATCHPACK_POLLING: "true"
      NEXT_WEBPACK_USEPOLLING: "true"
    working_dir: /app
    volumes:
      - ./:/app:delegated
      - /app/.next
    depends_on:
      - db
    command: "/bin/sh -c \"rm -rf node_modules && npm install && npx next dev\""
